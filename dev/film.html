<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VIDEOBOY film</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  * { box-sizing: border-box; }
  #stage {
    --bg: #F4ECDF; --ink: #2A190D; --ink2: #5E4330; --acc: #F26A1B; --acc-ink: #A8420A; --card: #FBF6EE; --rule: #D9C8AE; --plate: #EBDFCB;
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
    font-family: 'Inter', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  #stage[data-t='classic'] { --bg: #E2E0DA; --ink: #1B1D50; --ink2: #3F4170; --acc: #A3184F; --acc-ink: #8A1243; --card: #EFEEEA; --rule: #BDB9AF; --plate: #D2CFC7; }
  #stage[data-t='night'] { --bg: #0F1016; --ink: #E8EAF2; --ink2: #A9AEBF; --acc: #4FC8F5; --acc-ink: #7FD8FA; --card: #171921; --rule: #2D303C; --plate: #1C1E28; }
  /* faint dot grid on the backdrop, like the LCD it frames */
  #stage::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 0) 0 0 / 24px 24px; }
  #cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  #rig { position: absolute; left: 340px; top: 150px; width: 1240px; }
  #shelf { position: absolute; left: 0; width: 1240px; top: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .sizes { position: absolute; left: 0; top: 0; }
  .sizes > div { position: absolute; }
  .size-l { position: absolute; left: -60px; right: -60px; top: -64px; white-space: nowrap; text-align: center; font: 700 26px 'VB Silkscreen', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); }

  /* wordmark, as on the site */
  .wm { font-family: 'VB Press Start', monospace; letter-spacing: 0.02em; color: var(--ink); text-shadow: 0.07em 0.07em 0 var(--acc); white-space: nowrap; }
  .wm span { display: inline-block; }
  #title { position: absolute; left: 0; right: 0; top: 380px; text-align: center; }
  #title .wm { font-size: 150px; }
  #title .sub { margin-top: 44px; font: 600 44px/1.2 'Inter Display', 'Inter', sans-serif; color: var(--ink2); letter-spacing: -0.01em; }

  /* kinetic lines */
  .line { position: absolute; overflow: hidden; padding: 0 0 0.12em; font: 700 64px/1.08 'Inter Display', 'Inter', sans-serif; letter-spacing: -0.025em; color: var(--ink); white-space: nowrap; }
  .line > span { display: inline-block; will-change: transform; }
  .line.sm { font-size: 36px; font-weight: 600; color: var(--ink2); letter-spacing: -0.01em; }
  .line .a { color: var(--acc-ink); }
  .line.hd { font-size: 54px; }
  .line.hd > span { padding: 6px 18px 8px; border-radius: 12px; background: var(--bg); box-shadow: 0 16px 30px -18px rgb(0 0 0 / 0.5); }
  .tag { position: absolute; padding: 12px 18px 11px; border-radius: 10px; background: var(--ink); color: var(--bg); font: 700 22px/1 'VB Silkscreen', monospace; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 10px 24px -12px rgb(0 0 0 / 0.5); }
  .tag::after { content: ''; position: absolute; left: var(--px, 50%); bottom: -9px; width: 18px; height: 18px; margin-left: -9px; background: var(--ink); transform: rotate(45deg); border-radius: 3px; }
  .tag.down::after { top: -9px; bottom: auto; }

  /* keycap: the keyboard key that was pressed */
  #key { position: absolute; left: 116px; bottom: 104px; display: flex; gap: 14px; align-items: center; }
  .cap { min-width: 92px; height: 92px; padding: 0 22px; display: grid; place-items: center; border-radius: 16px; background: var(--card); color: var(--ink); font: 400 34px 'VB Press Start', monospace; box-shadow: inset 0 -8px 0 var(--rule), inset 0 0 0 2px var(--rule), 0 18px 30px -18px rgb(0 0 0 / 0.55); }
  .cap.wide { font-size: 22px; }
  .cap-l { font: 700 22px 'VB Silkscreen', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink2); }

  /* cursor */
  #cursor { position: absolute; left: 0; top: 0; width: 44px; height: 54px; z-index: 30; filter: drop-shadow(0 6px 8px rgb(0 0 0 / 0.35)); }

  /* cartridges, as on the site */
  .cart { position: relative; display: grid; gap: 6px; }
  .cart-body { position: relative; display: block; padding: 14px 14px 16px; border-radius: 10px 10px 18px 10px; background: linear-gradient(180deg, color-mix(in srgb, var(--plate) 70%, var(--ink) 6%), var(--plate)); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4), inset 0 0 0 1px var(--rule), 0 14px 24px -16px rgb(0 0 0 / 0.6); }
  .cart-ridge { display: block; height: 10px; margin: 0 18% 10px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--rule) 0 3px, transparent 3px 7px); }
  .cart-label { display: block; overflow: hidden; border-radius: 6px; aspect-ratio: 16 / 9; background: #111; }
  .cart-label img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.75); display: block; }
  .cart-led { position: absolute; top: 12px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 25%, transparent); }
  .cart-name { margin-top: 10px; font-weight: 600; font-size: 24px; color: var(--ink); }
  .cart-tag { font: 700 16px 'VB Silkscreen', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); }
  .cart.on .cart-body { box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4), inset 0 0 0 3px var(--acc), 0 22px 30px -18px rgb(0 0 0 / 0.7); }
  .cart.on .cart-body img { filter: none; }
  .cart.on .cart-led { background: var(--acc); box-shadow: 0 0 12px var(--acc); }
  .cart.on .cart-name { color: var(--acc-ink); }

  #end { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 0; }
  #end .wm { font-size: 120px; }
  #end .sub { margin-top: 40px; font: 600 40px 'Inter Display', 'Inter', sans-serif; color: var(--ink2); }
  #end .url { justify-self: center; margin-top: 46px; padding: 18px 30px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 400 26px 'VB Press Start', monospace; }
  #end .by { margin-top: 34px; font: 500 26px 'Inter', sans-serif; color: var(--ink2); }
  #end .chips { margin-top: 26px; display: flex; gap: 12px; justify-content: center; font: 700 18px 'VB Silkscreen', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink2); }
  #end .chips span { padding: 9px 14px 8px; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--rule); }

  #dissolve { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
</style>
<script type="module" src="./film.ts"></script>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="rig">
      <video-player id="vp"><videoboy-skin id="skin" no-chime poster="/dev/film/tos.jpg"><video id="vid" src="/dev/film/tos.mp4" playsinline preload="auto" crossorigin="anonymous"><track kind="subtitles" src="/dev/film/tos.vtt" srclang="en" label="English" default></video></videoboy-skin></video-player>
      <div id="shelf"></div>
      <div class="sizes" id="sizes"></div>
    </div>
  </div>
  <div id="title"><div class="wm" id="wm"></div><div class="sub" id="title-sub">A video player built like a handheld.</div></div>
  <div id="lines"></div>
  <div id="tags"></div>
  <div id="key"></div>
  <svg id="cursor" viewBox="0 0 11 14" shape-rendering="crispEdges"><path d="M0 0h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1h1v1H7v1h1v1h1v2H8v-1H7v-1H6v-1H5v1H4v1H3v1H1v1H0z" fill="#fff"/><path d="M1 1v11h1v-1h1v-1h1V9h1v1h1v1h1v1h1v-1h1v-1H8V9H7V8h3V7H9V6H8V5H7V4H6V3H5V2H4V1H3V0H1z" fill="#111" opacity="0"/><path d="M0 0v13h1v-1h1v-1h1v-1h1v1h1v1h1v1h1v1h2v-2H8v-1H7v-1h4V9h-1V8H9V7H8V6H7V5H6V4H5V3H4V2H3V1H2V0H0zm1 2h1v1h1v1h1v1h1v1h1v1h1v1h1v1H6v1h1v1h1v1H7v-1H6v-1H5V9H4v1H3v1H2v1H1z" fill="#111"/></svg>
  <div id="end" hidden>
    <div class="wm" id="end-wm">VIDEOBOY</div>
    <div class="sub">A skin for Video.js v10</div>
    <div class="url">videoboy.netlify.app</div>
    <div class="chips"><span>Streams from Mux</span><span>Keyboard first</span><span>Three themes</span><span>Reduced motion</span></div>
    <div class="by">Designed and built by Victor Ibidunmoye</div>
  </div>
  <canvas id="dissolve" width="1920" height="1080"></canvas>
</div>
</body>
</html>
